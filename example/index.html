<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>StimulusCheckAll demo</title>

    <script src="https://unpkg.com/@hotwired/stimulus@3/dist/stimulus.umd.js"></script>
    <script src="https://unpkg.com/stimulus-check-all@latest/dist/stimulus-check-all.umd.js"></script>
    <!-- To test in development run 'npm run build' and uncomment the next line -->
    <!-- <script src="../dist/stimulus-check-all.umd.js"></script> -->
    <script type="text/javascript">
      (function () {
        const application = Stimulus.Application.start();
        application.register("check-all", StimulusCheckAll);
      })();
    </script>
  </head>
  <body>
    <div data-controller="check-all">
      <div>Count: <span data-check-all-target="count">0</span></div>
      <label><input type="checkbox" data-check-all-target="all"> Check All</label>
      <label><input type="checkbox" data-check-all-target="checkbox"> github/fetch</label>
      <label><input type="checkbox" data-check-all-target="checkbox"> github/textarea-autosize</label>
      <label><input type="checkbox" data-check-all-target="checkbox"> github/eventlistener-polyfill</label>
      <label><input type="checkbox" data-check-all-target="checkbox"> github/quote-selection</label>
      <label><input type="checkbox"> skip-this-one</label>
    </div>
  </body>
</html>
